name: Release

# Pushing a tag like v0.1.0 builds the plugin and publishes a release with
# the zip. GitHub adds the tag's source archives to every release, which
# keeps each binary next to its corresponding source as the AGPL requires.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  # vcpkg removed its GitHub Actions cache backend; built packages are kept
  # in a folder that actions/cache saves instead.
  VCPKG_BINARY_SOURCES: "clear;files,C:\\vcpkg-binary-cache,readwrite"

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM (for bindgen)
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "15.0.6"
      - name: Cache the built codec libraries
        uses: actions/cache@v4
        with:
          path: C:\vcpkg-binary-cache
          key: vcpkg-x64-windows-static-${{ env.VCPKG_COMMIT_ID }}-${{ hashFiles('vcpkg.json', 'vcpkg-ports/**') }}
          restore-keys: vcpkg-x64-windows-static-${{ env.VCPKG_COMMIT_ID }}-
      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false
      - name: Build the codec libraries
        shell: bash
        run: |
          mkdir -p /c/vcpkg-binary-cache
          "$VCPKG_ROOT/vcpkg" install --triplet x64-windows-static --x-install-root="$VCPKG_ROOT/installed"
      - uses: dtolnay/rust-toolchain@stable
      - name: Check the tag matches the crate version
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          if ("v$version" -ne "${{ github.ref_name }}") { throw "tag ${{ github.ref_name }} != crate version $version" }
      - run: cargo build --release
      - run: cargo test --release
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/rustdesk | Out-Null
          Copy-Item target/release/casement-rustdesk.exe, plugin.json, LICENSE, README.md, CHANGELOG.md dist/rustdesk/
          Compress-Archive -Path dist/rustdesk -DestinationPath "casement-rustdesk-${{ github.ref_name }}-windows-x64.zip"
      - uses: softprops/action-gh-release@v2
        with:
          files: casement-rustdesk-${{ github.ref_name }}-windows-x64.zip
          generate_release_notes: true
