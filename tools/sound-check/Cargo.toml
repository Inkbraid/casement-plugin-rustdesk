# Plays tones through the plugin's sound output (src/sound) on its own, so
# the WASAPI side can run under Wine; see check.sh.
[package]
name = "sound-check"
version = "0.0.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

[dependencies]
log = "0.4"
env_logger = { version = "0.11", default-features = false }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_Media_Multimedia",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading",
    "Win32_System_Variant",
] }
